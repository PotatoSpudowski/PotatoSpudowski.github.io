<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Bahushruth CS</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="potato.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo" title="Home">
                <img src="potato.svg" alt="Potato" class="potato-icon">
            </a>
            <div class="nav-links">
                <a href="articles.html" class="nav-link">Articles</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <a href="articles.html" class="back-link">&larr; Back to articles</a>
        <article class="article-full" id="article">
            <div class="article-header">
                <h1 class="article-title-large" id="article-title"></h1>
                <p class="article-meta-large" id="article-meta"></p>
            </div>
            <div class="article-content" id="article-content"></div>
            <div class="article-tags" id="article-tags"></div>
        </article>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p class="footer-reach">Want to reach out? Drop me an email at <a class="footer-link" id="reach"></a> or DM me on <a href="https://x.com/Bahushruth" target="_blank" class="footer-link">X/Twitter</a>. I check both.</p>
            <div class="footer-bottom">
                <p class="footer-text">&copy; 2026 Bahushruth CS</p>
                <div class="footer-social">
                    <a href="https://github.com/bahushruth" target="_blank" class="footer-link">GitHub</a>
                    <a href="https://x.com/Bahushruth" target="_blank" class="footer-link">X/Twitter</a>
                    <a href="https://www.linkedin.com/in/bahushruth/" target="_blank" class="footer-link">LinkedIn</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script>
    (function () {
        var u = 'bahushruth.bahushruth';
        var d = 'gmail.com';
        var el = document.getElementById('reach');
        if (el) { el.href = 'mail' + 'to:' + u + '@' + d; el.textContent = u + '@' + d; }
    })();
    </script>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var slug = params.get('slug');
        if (!slug) { document.getElementById('article-content').textContent = 'Article not found.'; return; }

        fetch('articles/' + slug + '.md')
            .then(function (res) {
                if (!res.ok) throw new Error('Not found');
                return res.text();
            })
            .then(function (text) {
                // Parse frontmatter
                var meta = {};
                var body = text;
                if (text.startsWith('---')) {
                    var end = text.indexOf('---', 3);
                    if (end !== -1) {
                        var front = text.substring(3, end).trim();
                        body = text.substring(end + 3).trim();
                        front.split('\n').forEach(function (line) {
                            var idx = line.indexOf(':');
                            if (idx !== -1) {
                                var key = line.substring(0, idx).trim();
                                var val = line.substring(idx + 1).trim();
                                meta[key] = val;
                            }
                        });
                    }
                }

                document.title = (meta.title || 'Article') + ' - Bahushruth CS';
                document.getElementById('article-title').textContent = meta.title || '';
                var metaParts = [];
                if (meta.date) metaParts.push(meta.date);
                if (meta.readtime) metaParts.push(meta.readtime);
                document.getElementById('article-meta').textContent = metaParts.join(' \u00b7 ');

                // Render math then markdown
                var html = body;
                html = html.replace(/\$\$([\s\S]+?)\$\$/g, function (_, tex) {
                    try { return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }); }
                    catch (e) { return '$$' + tex + '$$'; }
                });
                html = html.replace(/\$([^\$\n]+?)\$/g, function (_, tex) {
                    try { return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false }); }
                    catch (e) { return '$' + tex + '$'; }
                });
                html = marked.parse(html);
                document.getElementById('article-content').innerHTML = html;

                // Tags
                if (meta.tags) {
                    var tagsEl = document.getElementById('article-tags');
                    meta.tags.split(',').forEach(function (t) {
                        var span = document.createElement('span');
                        span.className = 'tag';
                        span.textContent = t.trim();
                        tagsEl.appendChild(span);
                    });
                }
            })
            .catch(function () {
                document.getElementById('article-content').textContent = 'Article not found.';
            });
    })();
    </script>
</body>
</html>
