<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="800" height="220" fill="#0a0a0a" rx="8"/>

  <text x="400" y="24" fill="#e0e0e0" font-size="13" font-weight="600" text-anchor="middle">Anti-Replay: 64-Slot Sliding Bitmap Window</text>

  <!-- Window bracket -->
  <line x1="130" y1="42" x2="130" y2="52" stroke="#585858" stroke-width="1"/>
  <line x1="130" y1="42" x2="740" y2="42" stroke="#585858" stroke-width="1"/>
  <line x1="740" y1="42" x2="740" y2="52" stroke="#585858" stroke-width="1"/>
  <text x="435" y="39" fill="#585858" font-size="9" text-anchor="middle">replay_window (64 slots)</text>

  <!-- Sequence numbers -->
  <g font-family="Monaco,Menlo,monospace" font-size="8">
    <!-- Too old (red, rejected) -->
    <rect x="30" y="55" width="22" height="22" rx="2" fill="#ff7b7220" stroke="#ff7b7250" stroke-width="1"/>
    <text x="41" y="69" fill="#ff7b72" text-anchor="middle">37</text>
    <rect x="56" y="55" width="22" height="22" rx="2" fill="#ff7b7220" stroke="#ff7b7250" stroke-width="1"/>
    <text x="67" y="69" fill="#ff7b72" text-anchor="middle">38</text>
    <rect x="82" y="55" width="22" height="22" rx="2" fill="#ff7b7220" stroke="#ff7b7250" stroke-width="1"/>
    <text x="93" y="69" fill="#ff7b72" text-anchor="middle">39</text>

    <!-- In window - seen (green) -->
    <rect x="130" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="141" y="69" fill="#7ee787" text-anchor="middle">40</text>
    <rect x="156" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="167" y="69" fill="#7ee787" text-anchor="middle">41</text>
    <rect x="182" y="55" width="22" height="22" rx="2" fill="#11111150" stroke="#2a2a2a" stroke-width="1"/>
    <text x="193" y="69" fill="#585858" text-anchor="middle">42</text>
    <rect x="208" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="219" y="69" fill="#7ee787" text-anchor="middle">43</text>
    <rect x="234" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="245" y="69" fill="#7ee787" text-anchor="middle">44</text>

    <!-- dots -->
    <text x="270" y="69" fill="#585858">...</text>

    <rect x="296" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="307" y="69" fill="#7ee787" text-anchor="middle">80</text>
    <rect x="322" y="55" width="22" height="22" rx="2" fill="#11111150" stroke="#2a2a2a" stroke-width="1"/>
    <text x="333" y="69" fill="#585858" text-anchor="middle">81</text>
    <rect x="348" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="359" y="69" fill="#7ee787" text-anchor="middle">82</text>

    <!-- dots -->
    <text x="384" y="69" fill="#585858">...</text>

    <rect x="410" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="421" y="69" fill="#7ee787" text-anchor="middle">97</text>
    <rect x="436" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="447" y="69" fill="#7ee787" text-anchor="middle">98</text>
    <rect x="462" y="55" width="22" height="22" rx="2" fill="#11111150" stroke="#2a2a2a" stroke-width="1"/>
    <text x="473" y="69" fill="#585858" text-anchor="middle">99</text>
    <rect x="488" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="499" y="69" fill="#7ee787" text-anchor="middle">100</text>

    <!-- dots -->
    <text x="524" y="69" fill="#585858">...</text>

    <!-- Window top -->
    <rect x="550" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="561" y="69" fill="#7ee787" text-anchor="middle">101</text>
    <rect x="576" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="587" y="69" fill="#7ee787" text-anchor="middle">102</text>
    <rect x="602" y="55" width="22" height="22" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
    <text x="613" y="69" fill="#7ee787" text-anchor="middle">103</text>

    <!-- replay_window_top marker -->
    <rect x="716" y="55" width="26" height="22" rx="2" fill="#79c0ff20" stroke="#79c0ff" stroke-width="1.5"/>
    <text x="729" y="69" fill="#79c0ff" text-anchor="middle">104</text>
    <text x="729" y="89" fill="#79c0ff" font-size="8" text-anchor="middle">top</text>
  </g>

  <!-- bitmap visualization -->
  <text x="30" y="115" fill="#585858" font-size="9" font-family="Monaco,Menlo,monospace">bitmap:</text>
  <text x="80" y="115" fill="#7ee787" font-size="9" font-family="Monaco,Menlo,monospace">1 1 1 0 1 1 1 1 0 1 1 1 ... 1 0 1 1 1 1 0 1 1 1 1</text>
  <text x="570" y="115" fill="#585858" font-size="9">← 64 bits</text>

  <!-- Legend -->
  <rect x="30" y="135" width="740" height="75" rx="6" fill="#111" stroke="#2a2a2a" stroke-width="1"/>

  <rect x="50" y="150" width="12" height="12" rx="2" fill="#7ee78720" stroke="#7ee78750" stroke-width="1"/>
  <text x="70" y="160" fill="#909090" font-size="10">seen and accepted, bit is 1 in bitmap</text>

  <rect x="50" y="168" width="12" height="12" rx="2" fill="#11111150" stroke="#2a2a2a" stroke-width="1"/>
  <text x="70" y="178" fill="#909090" font-size="10">not yet received, bit is 0 (will accept if arrives)</text>

  <rect x="50" y="186" width="12" height="12" rx="2" fill="#ff7b7220" stroke="#ff7b7250" stroke-width="1"/>
  <text x="70" y="196" fill="#909090" font-size="10">too old (seq &lt; top - 63), rejected unconditionally</text>

  <text x="430" y="160" fill="#585858" font-size="9">new high seq → shift window right</text>
  <text x="430" y="178" fill="#585858" font-size="9">duplicate seq (bit=1) → rejected</text>
  <text x="430" y="196" fill="#585858" font-size="9">window resets on session key rotation</text>
</svg>