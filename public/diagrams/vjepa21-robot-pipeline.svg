<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.2"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#7ee787" stroke-width="1.2"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#79c0ff" stroke-width="1.2"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#d2a8ff" stroke-width="1.2"/></marker>
  </defs>

  <rect width="700" height="420" fill="#0a0a0a" rx="8"/>

  <text x="350" y="28" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="700">Zero-Shot Robot Control Pipeline</text>
  <text x="350" y="44" text-anchor="middle" fill="#585858" font-size="9">VisionTransformerPredictorAC · post-trained on DROID dataset</text>

  <!-- Two inputs -->
  <rect x="40" y="64" width="160" height="60" rx="5" fill="#111" stroke="#79c0ff" stroke-width="1"/>
  <text x="120" y="84" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="700">Camera Feed</text>
  <text x="120" y="100" text-anchor="middle" fill="#585858" font-size="8">current observation</text>
  <text x="120" y="114" text-anchor="middle" fill="#585858" font-size="7" font-family="Monaco, monospace">[B, 3, H, W]</text>

  <rect x="240" y="64" width="160" height="60" rx="5" fill="#111" stroke="#ffa657" stroke-width="1"/>
  <text x="320" y="84" text-anchor="middle" fill="#ffa657" font-size="10" font-weight="700">Goal Image</text>
  <text x="320" y="100" text-anchor="middle" fill="#585858" font-size="8">desired world state</text>
  <text x="320" y="114" text-anchor="middle" fill="#585858" font-size="7" font-family="Monaco, monospace">[B, 3, H, W]</text>

  <!-- Converging arrows -->
  <line x1="120" y1="124" x2="220" y2="148" stroke="#79c0ff" stroke-width="1" marker-end="url(#ab)"/>
  <line x1="320" y1="124" x2="220" y2="148" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <!-- Frozen Encoder -->
  <rect x="80" y="150" width="280" height="54" rx="5" fill="#111" stroke="#7ee787" stroke-width="1.2"/>
  <text x="220" y="170" text-anchor="middle" fill="#7ee787" font-size="10" font-weight="700">Frozen x-Encoder (ViT-G)</text>
  <text x="220" y="186" text-anchor="middle" fill="#585858" font-size="8">encode both views → latent representations</text>
  <text x="220" y="198" text-anchor="middle" fill="#585858" font-size="7" font-family="Monaco, monospace">torch.no_grad() · pretrained weights locked</text>

  <line x1="220" y1="204" x2="220" y2="224" stroke="#7ee787" stroke-width="1.2" marker-end="url(#ag)"/>

  <!-- AC Predictor -->
  <rect x="40" y="226" width="380" height="100" rx="5" fill="#111" stroke="#79c0ff" stroke-width="1.2"/>
  <text x="230" y="246" text-anchor="middle" fill="#79c0ff" font-size="10" font-weight="700">Action-Conditioned Predictor</text>
  <text x="230" y="260" text-anchor="middle" fill="#585858" font-size="8" font-family="Monaco, monospace">VisionTransformerPredictorAC</text>

  <!-- Token sequence -->
  <g transform="translate(60, 272)">
    <rect x="0"   y="0" width="50" height="16" rx="2" fill="#d2a8ff" stroke="none"/>
    <text x="25"  y="11" text-anchor="middle" fill="#0a0a0a" font-size="7" font-weight="600">action</text>
    <rect x="54"  y="0" width="44" height="16" rx="2" fill="#d2a8ff" stroke="none"/>
    <text x="76"  y="11" text-anchor="middle" fill="#0a0a0a" font-size="7" font-weight="600">state</text>
    <rect x="102" y="0" width="36" height="16" rx="2" fill="#79c0ff" stroke="none"/>
    <text x="120" y="11" text-anchor="middle" fill="#0a0a0a" font-size="7">patch1</text>
    <rect x="142" y="0" width="36" height="16" rx="2" fill="#79c0ff" stroke="none"/>
    <text x="160" y="11" text-anchor="middle" fill="#0a0a0a" font-size="7">patch2</text>
    <rect x="182" y="0" width="24" height="16" rx="2" fill="#79c0ff" stroke="none"/>
    <text x="194" y="11" text-anchor="middle" fill="#0a0a0a" font-size="7">...</text>
    <rect x="210" y="0" width="36" height="16" rx="2" fill="#79c0ff" stroke="none"/>
    <text x="228" y="11" text-anchor="middle" fill="#0a0a0a" font-size="7">patchN</text>
    <text x="270" y="11" fill="#585858" font-size="7">per frame</text>
  </g>

  <text x="230" y="306" text-anchor="middle" fill="#585858" font-size="7.5">causal attention mask: each frame sees only past + current</text>
  <text x="230" y="318" text-anchor="middle" fill="#585858" font-size="7.5">simulates action sequences in embedding space</text>

  <!-- Planning box on right -->
  <rect x="450" y="150" width="220" height="176" rx="5" fill="#111" stroke="#333" stroke-width="0.8"/>
  <text x="560" y="170" text-anchor="middle" fill="#909090" font-size="9" font-weight="700">Latent Planning</text>

  <text x="460" y="192" fill="#585858" font-size="7.5">1. Encode current view</text>
  <text x="460" y="208" fill="#585858" font-size="7.5">2. Encode goal image</text>
  <text x="460" y="224" fill="#585858" font-size="7.5">3. Sample N action sequences</text>
  <text x="460" y="240" fill="#585858" font-size="7.5">4. For each: predict future state</text>
  <text x="460" y="256" fill="#585858" font-size="7.5">    in embedding space</text>
  <text x="460" y="272" fill="#585858" font-size="7.5">5. Pick sequence whose predicted</text>
  <text x="460" y="288" fill="#585858" font-size="7.5">    state is closest to goal</text>
  <text x="460" y="308" fill="#d2a8ff" font-size="7.5">No pixel reconstruction needed.</text>
  <text x="460" y="322" fill="#d2a8ff" font-size="7.5">All planning in latent space.</text>

  <!-- Arrow to output -->
  <line x1="230" y1="326" x2="230" y2="346" stroke="#79c0ff" stroke-width="1.2" marker-end="url(#ab)"/>

  <!-- Best action -->
  <rect x="80" y="348" width="280" height="28" rx="5" fill="#111" stroke="#d2a8ff" stroke-width="1"/>
  <text x="220" y="366" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="600">Best Action Sequence → 7-DoF joint commands</text>

  <line x1="220" y1="376" x2="220" y2="390" stroke="#666" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Robot executes -->
  <rect x="80" y="390" width="280" height="22" rx="4" fill="#1c1c1c" stroke="#444" stroke-width="0.8"/>
  <text x="220" y="405" text-anchor="middle" fill="#909090" font-size="8">Franka Panda arm executes · zero-shot · no fine-tuning</text>

  <!-- Results box -->
  <rect x="450" y="348" width="220" height="64" rx="5" fill="#111" stroke="#7ee787" stroke-width="0.8"/>
  <text x="560" y="366" text-anchor="middle" fill="#7ee787" font-size="8" font-weight="600">Results (success rate)</text>
  <text x="460" y="382" fill="#7ee787" font-size="7" font-family="Monaco, monospace">P&amp;P Cup: V-JEPA 80% Octo 10%</text>
  <text x="460" y="396" fill="#7ee787" font-size="7" font-family="Monaco, monospace">P&amp;P Box: V-JEPA 50% Octo 10%</text>
  <text x="460" y="410" fill="#585858" font-size="7">Post-trained on DROID dataset · ac_predictor.py</text>
</svg>