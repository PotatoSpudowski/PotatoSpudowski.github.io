<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.2"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#d2a8ff" stroke-width="1.2"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#7ee787" stroke-width="1.2"/></marker>
  </defs>

  <rect width="800" height="400" fill="#0a0a0a" rx="8"/>

  <text x="400" y="28" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="700">Deep Self-Supervision — How Encoder Taps Work</text>
  <text x="400" y="44" text-anchor="middle" fill="#585858" font-size="9">vision_transformer.py · out_layers=[24, 32, 40]</text>

  <!-- Encoder tower -->
  <rect x="60" y="64" width="200" height="310" rx="6" fill="#111" stroke="#7ee787" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">x-Encoder (40 blocks)</text>

  <!-- Input -->
  <text x="160" y="104" text-anchor="middle" fill="#585858" font-size="8">visible tokens [B, N_vis, 1408]</text>

  <!-- Blocks 1-23 -->
  <rect x="78" y="114" width="164" height="14" rx="2" fill="#161616" stroke="#7ee787" stroke-width="0.6"/>
  <text x="160" y="124" text-anchor="middle" fill="#7ee787" font-size="7">Block 1</text>
  <rect x="78" y="132" width="164" height="10" rx="2" fill="#161616" stroke="#333" stroke-width="0.4"/>
  <rect x="78" y="146" width="164" height="10" rx="2" fill="#161616" stroke="#333" stroke-width="0.4"/>
  <text x="160" y="168" text-anchor="middle" fill="#585858" font-size="8">... blocks 2-23 ...</text>

  <!-- Block 24 (tap 1) -->
  <rect x="78" y="180" width="164" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="160" y="192" text-anchor="middle" fill="#d2a8ff" font-size="8" font-weight="600">Block 24</text>

  <text x="160" y="214" text-anchor="middle" fill="#585858" font-size="8">... blocks 25-31 ...</text>

  <!-- Block 32 (tap 2) -->
  <rect x="78" y="226" width="164" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="160" y="238" text-anchor="middle" fill="#d2a8ff" font-size="8" font-weight="600">Block 32</text>

  <text x="160" y="260" text-anchor="middle" fill="#585858" font-size="8">... blocks 33-39 ...</text>

  <!-- Block 40 (tap 3) -->
  <rect x="78" y="272" width="164" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="160" y="284" text-anchor="middle" fill="#d2a8ff" font-size="8" font-weight="600">Block 40 (final)</text>

  <!-- V-JEPA 2 label -->
  <rect x="78" y="302" width="164" height="22" rx="3" fill="#1c1c1c" stroke="#444" stroke-width="0.6"/>
  <text x="160" y="316" text-anchor="middle" fill="#585858" font-size="7">V-JEPA 2: only uses final output (block 40)</text>

  <!-- V-JEPA 2.1 label -->
  <rect x="78" y="330" width="164" height="22" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="160" y="344" text-anchor="middle" fill="#d2a8ff" font-size="7">V-JEPA 2.1: taps at 24, 32, 40</text>

  <!-- Tap arrows going right -->
  <line x1="242" y1="189" x2="320" y2="189" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#ap)"/>
  <line x1="242" y1="235" x2="320" y2="235" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#ap)"/>
  <line x1="242" y1="281" x2="320" y2="281" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#ap)"/>

  <!-- LayerNorm boxes -->
  <rect x="320" y="180" width="80" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="360" y="192" text-anchor="middle" fill="#d2a8ff" font-size="7.5">LayerNorm</text>

  <rect x="320" y="226" width="80" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="360" y="238" text-anchor="middle" fill="#d2a8ff" font-size="7.5">LayerNorm</text>

  <rect x="320" y="272" width="80" height="18" rx="3" fill="#161616" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="360" y="284" text-anchor="middle" fill="#d2a8ff" font-size="7.5">LayerNorm</text>

  <!-- Arrows to concat -->
  <line x1="400" y1="189" x2="460" y2="220" stroke="#d2a8ff" stroke-width="1" marker-end="url(#ap)"/>
  <line x1="400" y1="235" x2="460" y2="235" stroke="#d2a8ff" stroke-width="1" marker-end="url(#ap)"/>
  <line x1="400" y1="281" x2="460" y2="250" stroke="#d2a8ff" stroke-width="1" marker-end="url(#ap)"/>

  <!-- Concat box -->
  <rect x="460" y="210" width="120" height="50" rx="5" fill="#161616" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="520" y="230" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="600">Concat</text>
  <text x="520" y="246" text-anchor="middle" fill="#d2a8ff" font-size="8" font-family="Monaco, monospace">[tap1 | tap2 | tap3]</text>
  <text x="520" y="258" text-anchor="middle" fill="#585858" font-size="7">→ 3 x 1408 = 4224d</text>

  <!-- Arrow to MLP -->
  <line x1="580" y1="235" x2="620" y2="235" stroke="#d2a8ff" stroke-width="1.2" marker-end="url(#ap)"/>

  <!-- MLP Fusion box -->
  <rect x="620" y="210" width="140" height="50" rx="5" fill="#161616" stroke="#d2a8ff" stroke-width="1.2"/>
  <text x="690" y="230" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="600">MLP Fusion</text>
  <text x="690" y="246" text-anchor="middle" fill="#d2a8ff" font-size="8" font-family="Monaco, monospace">Linear(4224, 1408)</text>
  <text x="690" y="258" text-anchor="middle" fill="#585858" font-size="7">+ GELU + Linear</text>

  <!-- Output -->
  <text x="690" y="286" text-anchor="middle" fill="#7ee787" font-size="8" font-family="Monaco, monospace">fused [B, N_vis, 1408]</text>

  <!-- Dimension annotations on left -->
  <text x="270" y="184" fill="#585858" font-size="7">[B, N, 1408]</text>
  <text x="270" y="230" fill="#585858" font-size="7">[B, N, 1408]</text>
  <text x="270" y="276" fill="#585858" font-size="7">[B, N, 1408]</text>

  <!-- WHY box -->
  <rect x="460" y="300" width="300" height="80" rx="5" fill="#111" stroke="#333" stroke-width="0.8"/>
  <text x="470" y="318" fill="#909090" font-size="8" font-weight="600">Why deep supervision matters:</text>
  <text x="470" y="334" fill="#585858" font-size="7.5">V-JEPA 2 only supervised the final layer. By that point,</text>
  <text x="470" y="348" fill="#585858" font-size="7.5">fine-grained spatial info was already abstracted away.</text>
  <text x="470" y="362" fill="#585858" font-size="7.5">Tapping intermediate layers forces the network to preserve</text>
  <text x="470" y="376" fill="#585858" font-size="7.5">spatial structure throughout — enabling dense prediction.</text>

  <!-- Code reference -->
  <text x="400" y="396" text-anchor="middle" fill="#444" font-size="6.5">vision_transformer.py: forward() with out_layers · predictor.py: multi-level loss</text>
</svg>