<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b8dd9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a9e6f"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c4813a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d45d5d"/>
    </marker>
    <linearGradient id="videoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="transparent" rx="8"/>

  <!-- ==================== VIDEO INPUT ==================== -->
  <!-- Video frames (stacked) -->
  <rect x="370" y="20" width="70" height="50" rx="4" fill="#1a1a2e" stroke="#334" stroke-width="1.5"/>
  <rect x="380" y="15" width="70" height="50" rx="4" fill="#1a1a2e" stroke="#334" stroke-width="1.5"/>
  <rect x="390" y="10" width="70" height="50" rx="4" fill="#1a1a2e" stroke="#445" stroke-width="1.5"/>
  <text x="425" y="40" text-anchor="middle" fill="#99a" font-size="11" font-weight="500">video</text>

  <!-- 3D Patch Tokenizer -->
  <rect x="355" y="80" width="140" height="34" rx="6" fill="#111" stroke="#444" stroke-width="1.2"/>
  <text x="425" y="102" text-anchor="middle" fill="#bbb" font-size="11.5" font-weight="500">3D Patch Tokenizer</text>

  <!-- Arrow: video -> tokenizer -->
  <line x1="425" y1="60" x2="425" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Split arrows from tokenizer -->
  <!-- Left arrow to context path -->
  <path d="M 390 114 L 390 135 L 200 135 L 200 160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Right arrow to target path -->
  <path d="M 460 114 L 460 135 L 650 135 L 650 160" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== MASKING ==================== -->
  <!-- Masking box on context path -->
  <rect x="140" y="160" width="120" height="32" rx="6" fill="#1a1520" stroke="#6e4a8a" stroke-width="1.2"/>
  <text x="200" y="181" text-anchor="middle" fill="#b89ad4" font-size="11" font-weight="500">multi-block mask</text>

  <!-- Label: "visible patches" -->
  <text x="200" y="210" text-anchor="middle" fill="#777" font-size="10" font-style="italic">visible patches only</text>

  <!-- No masking label on target path -->
  <text x="650" y="181" text-anchor="middle" fill="#777" font-size="10" font-style="italic">all patches</text>

  <!-- ==================== CONTEXT ENCODER (left) ==================== -->
  <rect x="120" y="225" width="160" height="150" rx="8" fill="#0d1520" stroke="#3a6da8" stroke-width="1.5"/>
  <!-- Layer stack visualization -->
  <g opacity="0.6">
    <rect x="140" y="245" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="254" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="263" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="272" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="281" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="290" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="299" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="308" width="120" height="5" rx="2" fill="#2a5080"/>
    <text x="200" y="322" text-anchor="middle" fill="#3a6da8" font-size="8">...</text>
    <rect x="140" y="330" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="339" width="120" height="5" rx="2" fill="#2a5080"/>
    <rect x="140" y="348" width="120" height="5" rx="2" fill="#2a5080"/>
  </g>
  <!-- Label -->
  <text x="200" y="375" text-anchor="middle" fill="#6da8d4" font-size="13" font-weight="600">Context Encoder</text>
  <text x="200" y="240" text-anchor="middle" fill="#4a7ab0" font-size="10">ViT-G  |  40 layers  |  dim 1408</text>

  <!-- Arrow: mask -> encoder -->
  <line x1="200" y1="215" x2="200" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== TARGET ENCODER (right) ==================== -->
  <rect x="570" y="225" width="160" height="150" rx="8" fill="#0d2010" stroke="#3a8a4a" stroke-width="1.5"/>
  <!-- Layer stack -->
  <g opacity="0.6">
    <rect x="590" y="245" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="254" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="263" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="272" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="281" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="290" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="299" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="308" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <text x="650" y="322" text-anchor="middle" fill="#3a8a4a" font-size="8">...</text>
    <rect x="590" y="330" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="339" width="120" height="5" rx="2" fill="#2a6a3a"/>
    <rect x="590" y="348" width="120" height="5" rx="2" fill="#2a6a3a"/>
  </g>
  <!-- Label -->
  <text x="650" y="375" text-anchor="middle" fill="#6dd48a" font-size="13" font-weight="600">Target Encoder</text>
  <text x="650" y="240" text-anchor="middle" fill="#4aaa5a" font-size="10">ViT-G  |  40 layers  |  dim 1408</text>

  <!-- Arrow: tokens -> target encoder -->
  <line x1="650" y1="190" x2="650" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== EMA ARROW ==================== -->
  <path d="M 280 300 Q 425 280 570 300" fill="none" stroke="#c4813a" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow-orange)"/>
  <text x="425" y="274" text-anchor="middle" fill="#c4813a" font-size="11" font-weight="500">EMA  m=0.99925</text>
  <text x="425" y="260" text-anchor="middle" fill="#997040" font-size="9">no gradients</text>

  <!-- ==================== PREDICTOR (center bottom) ==================== -->
  <!-- Arrow from context encoder down -->
  <line x1="200" y1="375" x2="200" y2="420" stroke="#5b8dd9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Mask tokens merging in -->
  <rect x="30" y="405" width="100" height="30" rx="6" fill="#1a1520" stroke="#6e4a8a" stroke-width="1.2"/>
  <text x="80" y="425" text-anchor="middle" fill="#b89ad4" font-size="10" font-weight="500">mask tokens</text>
  <path d="M 130 420 L 165 450" fill="none" stroke="#6e4a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Position embeddings -->
  <rect x="30" y="450" width="100" height="30" rx="6" fill="#151520" stroke="#5555aa" stroke-width="1.2"/>
  <text x="80" y="470" text-anchor="middle" fill="#8888cc" font-size="10" font-weight="500">pos embeddings</text>
  <path d="M 130 465 L 165 465" fill="none" stroke="#5555aa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Predictor box -->
  <rect x="165" y="430" width="240" height="80" rx="8" fill="#1a1015" stroke="#9a5abf" stroke-width="1.5"/>
  <!-- Mini layer stack -->
  <g opacity="0.5">
    <rect x="185" y="448" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="455" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="462" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="469" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="476" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="483" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <rect x="185" y="490" width="90" height="4" rx="1.5" fill="#6a3a9a"/>
    <text x="230" y="502" text-anchor="middle" fill="#6a3a9a" font-size="7">...</text>
  </g>
  <text x="340" y="458" text-anchor="middle" fill="#c9a0e0" font-size="12" font-weight="600">Predictor</text>
  <text x="340" y="474" text-anchor="middle" fill="#8a6aaa" font-size="9.5">24 layers  |  dim 384</text>
  <text x="340" y="490" text-anchor="middle" fill="#8a6aaa" font-size="9.5">12 heads  |  narrow</text>
  <text x="340" y="505" text-anchor="middle" fill="#7a5a9a" font-size="9">predicts masked targets</text>

  <!-- Arrow from context encoder output into predictor -->
  <path d="M 200 420 L 200 430" fill="none" stroke="#5b8dd9" stroke-width="1.5"/>

  <!-- ==================== TARGET REPRESENTATIONS ==================== -->
  <!-- Arrow from target encoder down -->
  <line x1="650" y1="375" x2="650" y2="555" stroke="#5a9e6f" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="660" y="480" fill="#5a9e6f" font-size="10" font-style="italic" transform="rotate(-90, 660, 480)">target representations</text>

  <!-- ==================== L1 LOSS ==================== -->
  <!-- Arrow from predictor to loss -->
  <line x1="285" y1="510" x2="285" y2="555" stroke="#9a5abf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Predicted representations label -->
  <text x="270" y="540" text-anchor="end" fill="#8a6aaa" font-size="10" font-style="italic">predicted repr.</text>

  <!-- Loss box -->
  <rect x="230" y="555" width="470" height="44" rx="8" fill="#200d0d" stroke="#d45d5d" stroke-width="1.5"/>
  <text x="465" y="575" text-anchor="middle" fill="#e88" font-size="14" font-weight="600">L1 Loss</text>
  <text x="465" y="591" text-anchor="middle" fill="#a55" font-size="10">loss = mean(|predicted - target|)  +  lambda * context_loss</text>

  <!-- "stop gradient" label on target side -->
  <rect x="610" y="520" width="80" height="22" rx="4" fill="#0a0a0a" stroke="#555" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="650" y="535" text-anchor="middle" fill="#888" font-size="9">stop gradient</text>

  <!-- Legend -->
  <g transform="translate(700, 20)">
    <text x="0" y="0" fill="#777" font-size="10" font-weight="600">COMPONENTS</text>
    <line x1="0" y1="15" x2="12" y2="15" stroke="#3a6da8" stroke-width="2"/>
    <text x="18" y="19" fill="#6da8d4" font-size="9.5">Encoder (trained)</text>
    <line x1="0" y1="30" x2="12" y2="30" stroke="#3a8a4a" stroke-width="2"/>
    <text x="18" y="34" fill="#6dd48a" font-size="9.5">Target (EMA copy)</text>
    <line x1="0" y1="45" x2="12" y2="45" stroke="#9a5abf" stroke-width="2"/>
    <text x="18" y="49" fill="#c9a0e0" font-size="9.5">Predictor</text>
    <line x1="0" y1="60" x2="12" y2="60" stroke="#d45d5d" stroke-width="2"/>
    <text x="18" y="64" fill="#e88" font-size="9.5">Loss</text>
    <line x1="0" y1="75" x2="12" y2="75" stroke="#c4813a" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="18" y="79" fill="#c4813a" font-size="9.5">EMA update</text>
  </g>
</svg>