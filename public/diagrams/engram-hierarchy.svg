<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="800" height="560" fill="#0a0a0a" rx="8"/>

  <text x="400" y="32" fill="#e0e0e0" font-size="13" font-weight="600" text-anchor="middle">where model state belongs</text>
  <text x="400" y="52" fill="#585858" font-size="9" text-anchor="middle">the architecture has to earn the slower tier</text>

  <!-- hot to cold rail -->
  <line x1="34" y1="80" x2="34" y2="500" stroke="#333" stroke-width="1.5"/>
  <polygon points="34,512 28,498 40,498" fill="#333"/>
  <text x="22" y="300" fill="#585858" font-size="9" transform="rotate(-90 22 300)" text-anchor="middle">hot to cold</text>

  <!-- TIER 1 HBM -->
  <rect x="56" y="76" width="708" height="128" rx="8" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="80" y="104" fill="#ff7b72" font-size="12" font-weight="600">HBM</text>
  <text x="140" y="104" fill="#e0e0e0" font-size="11">hot dense state</text>
  <text x="80" y="128" fill="#909090" font-size="10">active weights, hot KV, runtime workspace</text>
  <text x="80" y="146" fill="#585858" font-size="9">access pattern: every token, dense, needs bandwidth every step</text>
  <rect x="556" y="92" width="184" height="46" rx="4" fill="#ff7b7212" stroke="#ff7b7230"/>
  <text x="648" y="111" fill="#ff7b72" font-size="11" text-anchor="middle">4.8 TB/s</text>
  <text x="648" y="126" fill="#585858" font-size="8" text-anchor="middle">H200 local HBM</text>
  <text x="80" y="180" fill="#585858" font-size="9">bytes that must stay here</text>
  <rect x="260" y="168" width="480" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="260" y="168" width="336" height="12" rx="3" fill="#ff7b7266"/>

  <!-- TIER 2 HOST DRAM -->
  <rect x="56" y="222" width="708" height="150" rx="8" fill="none" stroke="#79c0ff" stroke-width="1.5"/>
  <text x="80" y="250" fill="#79c0ff" font-size="12" font-weight="600">HOST DRAM</text>
  <text x="190" y="250" fill="#e0e0e0" font-size="11">sparse predictable state</text>
  <text x="80" y="274" fill="#909090" font-size="10">Engram tables, cold KV, pinned pools</text>
  <text x="80" y="292" fill="#585858" font-size="9">access pattern: a few KB per token, address known before the layer runs</text>
  <rect x="80" y="308" width="660" height="30" rx="4" fill="#79c0ff12" stroke="#79c0ff30"/>
  <text x="410" y="327" fill="#79c0ff" font-size="10" text-anchor="middle">200 GB logical table. fetch a few rows per token. hide it behind compute.</text>
  <rect x="556" y="238" width="184" height="46" rx="4" fill="#79c0ff12" stroke="#79c0ff30"/>
  <text x="648" y="257" fill="#79c0ff" font-size="11" text-anchor="middle">~614 GB/s</text>
  <text x="648" y="272" fill="#585858" font-size="8" text-anchor="middle">EPYC socket DRAM</text>
  <text x="80" y="358" fill="#585858" font-size="9">bytes that can live here</text>
  <rect x="260" y="346" width="480" height="12" rx="3" fill="#1a1a1a"/>
  <rect x="260" y="346" width="418" height="12" rx="3" fill="#79c0ff66"/>

  <!-- TIER 3 CXL / SSD -->
  <rect x="56" y="390" width="708" height="104" rx="8" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <text x="80" y="418" fill="#7ee787" font-size="12" font-weight="600">CXL / SSD</text>
  <text x="180" y="418" fill="#e0e0e0" font-size="11">cold state</text>
  <text x="80" y="442" fill="#909090" font-size="10">the very cold tail. huge and slow.</text>
  <text x="80" y="460" fill="#585858" font-size="9">access pattern: only works if the runtime can predict requests far enough ahead</text>
  <text x="80" y="480" fill="#585858" font-size="9">bytes that must be tiny here or it stalls</text>

  <!-- caveat -->
  <text x="400" y="524" fill="#444" font-size="8" text-anchor="middle">bandwidths are illustrative. GPU HBM, CPU socket DRAM and the CPU to GPU link are different parts of the path.</text>
</svg>
